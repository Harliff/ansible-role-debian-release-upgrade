---
- name: Gather facts
  ansible.builtin.setup:

- name: Set os release facts
  ansible.builtin.set_fact:
    current_release_version: "{{ ansible_distribution_major_version | int }}"
    current_release_name: "{{ releases[ansible_distribution_major_version | int] }}"
    next_release_version: "{{ ansible_distribution_major_version | int + 1 }}"
    next_release_name: "{{ releases.get(ansible_distribution_major_version | int + 1, 'unknown') }}"
    required_release_name: "{{ releases[required_release_version | int] }}"
    upgrades: "{{ range((ansible_distribution_major_version | int) + 1, (required_release_version | int) + 1) | list }}"

- name: Print upgrade status
  ansible.builtin.debug:
    msg: |
      {% if upgrades | count > 0 %}
      Performing {{ upgrades | count }} upgrade(s):
      {% for i in upgrades %}
        Debian {{ releases[i - 1] }} => Debian {{ releases[i] }}
      {% endfor %}
      {% elif (required_release_version | int) < (current_release_version | int) %}
      Target system is Debian {{ current_release_version }} ({{ current_release_name }}), which is newer than the required version {{ required_release_version }} ({{ required_release_name }}). Nothing to do!
      {% else %}
      Target is already Debian {{ current_release_version }} ({{ current_release_name }}). Nothing to do!
      {% endif %}

- name: End host execution if already at or above target release
  ansible.builtin.meta: end_host
  when: upgrades | count == 0

- name: Ask for user confirmation
  ansible.builtin.pause:
    prompt: 'The system is going to upgrade to the "{{ required_release_name }}" release. Press CTRL+C, then A to abort or any key to continue.'

# 'shutdown -r' does not work on Debian 8
# this will generate errors like
# Failed to set wall message, ignoring: Interactive authentication required.
# We use a helper shutdown command that works on all releases
- name: Ensure helper reboot script is available
  ansible.builtin.copy:
    dest: /usr/local/sbin/shutdown
    content: |
      #!/bin/sh
      systemctl reboot
    mode: 0755
    owner: root
    group: root

- name: Include release upgrade tasks
  ansible.builtin.include_tasks: release_upgrade.yml
  loop: "{{ upgrades }}"
  loop_control:
    loop_var: t
    label: "Upgrade to Debian {{ t }} ({{ releases[t | int] }})"
  when: ansible_distribution_major_version|int < required_release_version|int

- name: Remove unused packages
  ansible.builtin.apt:
    autoremove: yes

- name: Clean up package cache
  ansible.builtin.apt:
    autoclean: yes

- name: Ensure helper reboot scripts is removed again
  ansible.builtin.file:
    path: /usr/local/sbin/shutdown
    state: absent
